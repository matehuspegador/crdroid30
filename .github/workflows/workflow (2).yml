name: Build AtomX Kernel (KernelSU-Next legacy)

# ---------------------------------------------------------------------------
# This workflow:
#   1. Checks out the kernel source
#   2. Deletes the old drivers/kernelsu (legacy KernelSU) driver
#   3. Fetches KernelSU-Next using its "legacy" (manual-hook) setup, which is
#      the supported path for pre-GKI / 5.4-class kernels
#   4. Flips the defconfig to manual-hook mode (kprobes off, CONFIG_KSU on)
#   5. Tunes CPU governor/scheduler, I/O scheduler, zram and TCP congestion
#      control for daily-use performance
#   6. Best-effort auto-patches the manual hooks that KernelSU-Next needs
#      (fs/exec.c, fs/read_write.c, fs/devpts/inode.c, drivers/input/input.c)
#   7. Builds the kernel and uploads Image/dtbo as artifacts
#
# IMPORTANT — read before running:
#   - The defconfig path/name and build command below are best guesses based
#     on the file names visible in the repo (build.config.msm.lahaina, the
#     arch/arm64/configs tree, build.sh). Confirm/adjust the `defconfig` and
#     `build_config` workflow inputs for your actual target before running.
#   - The auto-patch step is anchor-based (it looks for known, stable lines
#     from the official KernelSU non-GKI guide) so it survives most kernel
#     trees, but it is NOT a substitute for reviewing the diff it produces.
#     The job uploads a patch-report.txt artifact — check it.
#   - fs/namespace.c is auto-patched with the official can_umount/path_umount
#     backport (needed on any kernel < 5.9 for the KernelSU "module umount"
#     feature, and to avoid an "undefined symbol: path_umount" link error --
#     see the "Backport path_umount" step). Like the other hooks, it's
#     anchor-based, so check patch-report.txt if it reports a FAIL for
#     fs/namespace.c.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name, no _defconfig suffix"
        required: true
        default: "vendor/dubai-qgki"
      arch:
        description: "Kernel arch"
        required: true
        default: "arm64"
      ksu_ref:
        description: "KernelSU-Next setup.sh ref to use (legacy = manual-hook path for old/5.4-class kernels)"
        required: true
        default: "legacy"
      build_config:
        description: "build.config.* file to pass to build.sh (leave blank to fall back to plain make — confirm the right build.config.* for dubai/SM7325 in the repo before setting this)"
        required: false
        default: ""
      clang_repo:
        description: "Proton Clang source. kdrag0n's original is frozen/archived, which is exactly why it's the recommended pick for 5.4-class kernels — it stopped updating right around the LLVM version most CAF/QGKI 5.4 trees were validated against. Newer clang releases are more likely to choke on old kernel C."
        required: true
        default: "https://github.com/kdrag0n/proton-clang"
  push:
    branches: [ topaz-rebase ]

env:
  KSU_SETUP_URL: https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize submodules (best-effort, timed, non-interactive)
        timeout-minutes: 15
        run: |
          set -e
          export GIT_TERMINAL_PROMPT=0

          if [ ! -f .gitmodules ]; then
            echo "No .gitmodules — nothing to do."
            exit 0
          fi

          echo "---- .gitmodules ----"
          cat .gitmodules

          git submodule sync --recursive

          # Non-blocking: if a submodule is private/unreachable/huge, don't let
          # it hang the whole job forever — `timeout` kills it, and we log a
          # warning instead of failing. Most kernel builds don't strictly need
          # every vendor/device submodule just to compile the kernel image.
          if ! timeout 600 git submodule update --init --recursive --depth 1; then
            echo "::warning::Submodule init timed out or failed for one or more submodules. Continuing without them — if the build fails later needing a missing path, that submodule is actually required and needs a token/deploy key set up in repo Settings > Secrets."
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            git libncurses-dev libssl-dev python3 rsync unzip zip \
            libelf-dev lz4 dwarves device-tree-compiler

      - name: Fetch Proton Clang toolchain
        timeout-minutes: 15
        run: |
          set -e
          git clone --depth=1 "${{ github.event.inputs.clang_repo || 'https://github.com/kdrag0n/proton-clang' }}" "$GITHUB_WORKSPACE/proton-clang"

          CLANG_BIN="$GITHUB_WORKSPACE/proton-clang/bin"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/proton-clang/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

          # Old (pre-5.9) CAF/QGKI Makefiles look for CROSS_COMPILE_ARM32;
          # kernels 4.19+ use the upstream CROSS_COMPILE_COMPAT name instead.
          # Set both so whichever this tree expects is covered.
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=$GITHUB_WORKSPACE/proton-clang/bin/aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/proton-clang/bin/arm-linux-gnueabi-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_COMPAT=$GITHUB_WORKSPACE/proton-clang/bin/arm-linux-gnueabi-" >> "$GITHUB_ENV"
          echo "AR=llvm-ar" >> "$GITHUB_ENV"
          echo "NM=llvm-nm" >> "$GITHUB_ENV"
          echo "OBJCOPY=llvm-objcopy" >> "$GITHUB_ENV"
          echo "OBJDUMP=llvm-objdump" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip" >> "$GITHUB_ENV"

          {
            echo "## Toolchain"
            echo
            echo "Using \`${{ github.event.inputs.clang_repo || 'https://github.com/kdrag0n/proton-clang' }}\`:"
            echo '```'
            "$CLANG_BIN/clang" --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove legacy KernelSU driver (drivers/kernelsu)
        run: |
          set -e
          if [ -d drivers/kernelsu ] || [ -L drivers/kernelsu ]; then
            echo "Removing existing drivers/kernelsu ..."
            rm -rf drivers/kernelsu
          else
            echo "No drivers/kernelsu present, nothing to remove."
          fi

          # Strip old KernelSU references from drivers/Kconfig and drivers/Makefile
          # so the tree doesn't try to build/link a directory that no longer exists.
          for f in drivers/Kconfig drivers/Makefile; do
            if [ -f "$f" ]; then
              cp "$f" "$f.bak"
              grep -inE 'kernelsu|CONFIG_KSU' "$f" > "$f.removed.txt" || true
              sed -i '/kernelsu/Id' "$f"
              sed -i '/CONFIG_KSU\b/Id' "$f"
              echo "---- lines stripped from $f ----"
              cat "$f.removed.txt" || true
            fi
          done

      - name: Fetch KernelSU-Next (legacy / manual-hook setup)
        timeout-minutes: 10
        run: |
          set -e
          curl -LSs "$KSU_SETUP_URL" | bash -s ${{ github.event.inputs.ksu_ref || 'legacy' }}
          echo "KernelSU-Next added at:"
          ls -la KernelSU-Next 2>/dev/null || ls -la drivers/kernelsu 2>/dev/null || true

      - name: Discover defconfig & build layout (no terminal needed — read this in the Summary tab)
        id: discover
        run: |
          set -e
          ARCH="${{ github.event.inputs.arch || 'arm64' }}"
          WANTED="${{ github.event.inputs.defconfig || 'vendor/dubai-qgki' }}"
          WANTED_PATH="arch/${ARCH}/configs/${WANTED}_defconfig"

          {
            echo "## Kernel build layout discovery"
            echo
            echo "Requested defconfig: \`${WANTED}_defconfig\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$WANTED_PATH" ]; then
            FOUND_PATH="$WANTED_PATH"
            echo "Found requested defconfig at \`$FOUND_PATH\` ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Not found at \`$WANTED_PATH\` — searching the tree for anything matching *dubai*..." >> "$GITHUB_STEP_SUMMARY"
            # Try to auto-match a dubai/qgki defconfig anywhere under arch/*/configs
            CANDIDATE=$(find arch -type f -iname "*dubai*defconfig*" 2>/dev/null | head -n1 || true)
            if [ -z "$CANDIDATE" ]; then
              CANDIDATE=$(find arch -type f -iname "*defconfig*" 2>/dev/null | grep -i qgki | head -n1 || true)
            fi
            if [ -n "$CANDIDATE" ]; then
              FOUND_PATH="$CANDIDATE"
              echo "Auto-detected candidate defconfig: \`$FOUND_PATH\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ Could not auto-detect any defconfig. Every defconfig-like file found in the repo:" >> "$GITHUB_STEP_SUMMARY"
              find arch -iname "*defconfig*" 2>/dev/null | sed 's/^/- `/;s/$/`/' >> "$GITHUB_STEP_SUMMARY" || true
              echo "::error::No defconfig found. Open this run's Summary tab, pick the right path from the list, and re-run with the 'defconfig' input set to that path (relative to arch/<ARCH>/configs, without the _defconfig suffix)."
              exit 1
            fi
          fi

          echo "defconfig_path=${FOUND_PATH}" >> "$GITHUB_OUTPUT"

          # QGKI kernels often need fragments merged via scripts/gki/generate_defconfig.sh
          # before the defconfig is complete — detect and note that.
          if [ -f scripts/gki/generate_defconfig.sh ]; then
            echo "Detected \`scripts/gki/generate_defconfig.sh\` (QGKI fragment generator) — will run it before building." >> "$GITHUB_STEP_SUMMARY"
            echo "has_generate_defconfig=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_generate_defconfig=false" >> "$GITHUB_OUTPUT"
          fi

          # Look for a build.sh + build.config.* pair (common in QCOM/CAF-derived trees)
          BC=$(find . -maxdepth 1 -iname "build.config*" 2>/dev/null | grep -iE 'dubai|qgki' | head -n1 || true)
          if [ -z "$BC" ]; then
            BC=$(find . -maxdepth 1 -iname "build.config*" 2>/dev/null | head -n1 || true)
          fi
          # IMPORTANT: `actions/checkout` does not always preserve the executable
          # bit (depends on the repo's git history / core.fileMode), so gating on
          # `[ -x build.sh ]` alone silently falls back to plain `make` even when
          # build.sh is present and perfectly usable -- and plain `make` neither
          # merges QGKI defconfig fragments the way build.sh does nor packages an
          # AnyKernel3 zip, which is exactly the "no Image, no anykernel" failure
          # mode this was hit by. Force the bit on instead of just checking it.
          if [ -f build.sh ]; then
            chmod +x build.sh
          fi
          if [ -n "$BC" ] && [ -x build.sh ]; then
            echo "Detected build script: \`build.sh\` with \`${BC#./}\` — will use it (it also packages the AnyKernel3 zip)." >> "$GITHUB_STEP_SUMMARY"
            echo "build_config=${BC#./}" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ No usable build.sh/build.config.* pair detected (build.sh present: $([ -f build.sh ] && echo yes || echo no)) — will fall back to plain \`make\`. Plain \`make\` only produces a raw \`Image\`; it does NOT package an AnyKernel3 zip. If this repo is supposed to build one, fix/commit build.sh or use the dedicated packaging step added below." >> "$GITHUB_STEP_SUMMARY"
            echo "build_config=" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable manual-hook mode in defconfig
        run: |
          set -e
          DEFCONFIG_PATH="${{ steps.discover.outputs.defconfig_path }}"

          echo "Patching $DEFCONFIG_PATH"
          cp "$DEFCONFIG_PATH" "$DEFCONFIG_PATH.bak"

          set_cfg() {
            local key="$1" val="$2"
            sed -i "/^${key}=/d" "$DEFCONFIG_PATH"
            sed -i "/^# ${key} is not set/d" "$DEFCONFIG_PATH"
            echo "${key}=${val}" >> "$DEFCONFIG_PATH"
          }
          unset_cfg() {
            local key="$1"
            sed -i "/^${key}=/d" "$DEFCONFIG_PATH"
            echo "# ${key} is not set" >> "$DEFCONFIG_PATH"
          }

          set_cfg CONFIG_KSU y
          set_cfg CONFIG_KSU_MANUAL_HOOK y
          # Manual hooks + kprobes enabled at the same time is what causes the
          # boot loops reported for 5.4-class kernels — keep kprobes off.
          unset_cfg CONFIG_KPROBES
          unset_cfg CONFIG_KPROBE_EVENTS
          unset_cfg CONFIG_HAVE_KPROBES

          echo "---- diff ----"
          diff -u "$DEFCONFIG_PATH.bak" "$DEFCONFIG_PATH" || true

      - name: Tune CPU/IO/zram/network for daily-use performance
        # Goal: better perceived performance (touch/foreground responsiveness,
        # app-launch I/O latency, RAM headroom under pressure, and real-world
        # network throughput) without touching sustained clocks or scheduler
        # internals — safe for a daily driver. Deliberately NOT porting BORE:
        # it targets the EEVDF/CFS scheduler in mainline 6.1+, and
        # backporting it onto a 5.4-class CAF tree (this one) would mean
        # rewriting core scheduler code, not applying a patch — too high
        # risk for daily use.
        #
        # Every symbol below is checked against this tree's own Kconfig
        # files first (grep), so nothing gets set blindly if the driver/
        # symbol doesn't exist in this fork — same anchor-based approach
        # used elsewhere in this workflow.
        run: |
          set -e
          DEFCONFIG_PATH="${{ steps.discover.outputs.defconfig_path }}"
          cp "$DEFCONFIG_PATH" "$DEFCONFIG_PATH.perf.bak"

          set_cfg() {
            local key="$1" val="$2"
            local sym="${key#CONFIG_}"
            if ! grep -rqE "^\s*config\s+${sym}\s*$" --include=Kconfig* . 2>/dev/null; then
              echo "  (skip) ${key}: symbol not found in this tree's Kconfig files"
              return
            fi
            sed -i "/^${key}=/d" "$DEFCONFIG_PATH"
            sed -i "/^# ${key} is not set/d" "$DEFCONFIG_PATH"
            echo "${key}=${val}" >> "$DEFCONFIG_PATH"
            echo "  (set)  ${key}=${val}"
          }

          echo "== CPU governor / scheduler tuning =="

          # schedutil: mandatory governor since Android 10 CDD, well-tested
          # on this chip family, good balance of responsiveness/battery.
          set_cfg CONFIG_CPU_FREQ_GOV_SCHEDUTIL y
          set_cfg CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL y

          # CAF's input-boost driver: short freq bump on touch input only,
          # does not raise sustained clocks. Standard on Lahaina-family
          # (dubai) kernels.
          set_cfg CONFIG_CPU_BOOST y

          # WALT (Window-Assisted Load Tracking): gives the scheduler a
          # more accurate load picture than plain PELT. Native to this
          # kernel family — this just guards against it being off.
          set_cfg CONFIG_SCHED_WALT y

          # Foreground-app boost: some CAF/Motorola trees use the older
          # SchedTune cgroup, others have migrated to mainline uclamp.
          # Detect which one this tree actually has instead of assuming,
          # so we don't fight a migration that already happened upstream.
          if grep -rqE "^\s*config\s+SCHED_TUNE\s*$" --include=Kconfig* . 2>/dev/null; then
            set_cfg CONFIG_SCHED_TUNE y
          elif grep -rqE "^\s*config\s+UCLAMP_TASK\s*$" --include=Kconfig* . 2>/dev/null; then
            echo "  (info) this tree uses UCLAMP_TASK instead of SCHED_TUNE for foreground boost"
            set_cfg CONFIG_UCLAMP_TASK y
            set_cfg CONFIG_UCLAMP_TASK_GROUP y
          else
            echo "  (skip) neither CONFIG_SCHED_TUNE nor CONFIG_UCLAMP_TASK found in this tree's Kconfig files"
          fi

          echo "== I/O scheduler tuning =="

          # Kyber: low-latency multiqueue-block I/O scheduler, tuned for
          # UFS/eMMC flash storage found on this chip family. Much better
          # tail latency for app launches / random reads than the noop/
          # deadline defaults many CAF defconfigs still ship with.
          set_cfg CONFIG_MQ_IOSCHED_KYBER y

          # BFQ as a fallback choice (still fair on background writes),
          # only wired up as the tree's actual boot-time default below if
          # Kyber isn't present in this fork.
          set_cfg CONFIG_IOSCHED_BFQ y
          set_cfg CONFIG_MQ_IOSCHED_BFQ y

          if grep -rqE '^\s*config\s+MQ_IOSCHED_KYBER\s*$' --include=Kconfig* . 2>/dev/null; then
            sed -i '/^CONFIG_DEFAULT_IOSCHED=/d' "$DEFCONFIG_PATH"
            echo 'CONFIG_DEFAULT_IOSCHED="kyber"' >> "$DEFCONFIG_PATH"
            echo "  (set)  CONFIG_DEFAULT_IOSCHED=\"kyber\""
          elif grep -rqE '^\s*config\s+MQ_IOSCHED_BFQ\s*$' --include=Kconfig* . 2>/dev/null; then
            sed -i '/^CONFIG_DEFAULT_IOSCHED=/d' "$DEFCONFIG_PATH"
            echo 'CONFIG_DEFAULT_IOSCHED="bfq"' >> "$DEFCONFIG_PATH"
            echo "  (set)  CONFIG_DEFAULT_IOSCHED=\"bfq\" (kyber unavailable in this tree)"
          else
            echo "  (skip) no mq-based I/O scheduler found in this tree's Kconfig files, leaving default"
          fi

          echo "== zram tuning =="

          # zram + zstd: better compression ratio than lz4 at a CPU cost
          # this chip family easily absorbs, so more usable RAM under
          # memory pressure without extra swap thrash. zsmalloc is the
          # allocator zram needs.
          set_cfg CONFIG_ZRAM y
          set_cfg CONFIG_ZSMALLOC y
          set_cfg CONFIG_ZRAM_MEMORY_TRACKING y
          if grep -rqE "^\s*config\s+ZRAM_DEF_COMP_ZSTD\s*$" --include=Kconfig* . 2>/dev/null; then
            set_cfg CONFIG_ZRAM_DEF_COMP_ZSTD y
          else
            echo "  (skip) CONFIG_ZRAM_DEF_COMP_ZSTD: symbol not found in this tree's Kconfig files"
          fi
          set_cfg CONFIG_CRYPTO_ZSTD y

          echo "== Network stack tuning =="

          # TCP BBR + fq: meaningfully better throughput/latency than the
          # CUBIC default on real-world mobile networks (handles bufferbloat
          # much better). Purely a congestion-control algorithm swap, no
          # effect on kernel stability.
          set_cfg CONFIG_TCP_CONG_ADVANCED y
          set_cfg CONFIG_TCP_CONG_BBR y
          set_cfg CONFIG_NET_SCH_FQ y
          if grep -rqE "^\s*config\s+TCP_CONG_BBR\s*$" --include=Kconfig* . 2>/dev/null; then
            sed -i '/^CONFIG_DEFAULT_TCP_CONG=/d' "$DEFCONFIG_PATH"
            echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> "$DEFCONFIG_PATH"
            echo "  (set)  CONFIG_DEFAULT_TCP_CONG=\"bbr\""
          else
            echo "  (skip) CONFIG_DEFAULT_TCP_CONG=\"bbr\": TCP_CONG_BBR not found in this tree's Kconfig files"
          fi

          echo "---- diff ----"
          diff -u "$DEFCONFIG_PATH.perf.bak" "$DEFCONFIG_PATH" || true

          {
            echo "## Performance tuning (CPU / I/O / zram / network)"
            echo
            echo '```diff'
            diff -u "$DEFCONFIG_PATH.perf.bak" "$DEFCONFIG_PATH" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Auto-patch manual KernelSU-Next hooks
        run: |
          set -e
          cat > /tmp/apply_ksu_hooks.py <<'PYEOF'
          import re, sys, pathlib

          REPORT = []

          def patch_file(path, marker, anchor_regex, extern_block, call_block, insert_mode="after_anchor_line"):
              p = pathlib.Path(path)
              if not p.exists():
                  REPORT.append(f"SKIP  {path}: file not found")
                  return
              text = p.read_text()
              if marker in text:
                  REPORT.append(f"SKIP  {path}: already patched")
                  return

              m = re.search(anchor_regex, text)
              if not m:
                  REPORT.append(f"FAIL  {path}: anchor pattern not found, needs manual hook -> {anchor_regex}")
                  return

              if insert_mode == "before_line":
                  # anchor_regex is expected to end at the opening brace "{" of the
                  # function body. Insert the extern block before the line containing
                  # the match, and the call block right after that "{".
                  line_start = text.rfind("\n", 0, m.start()) + 1
                  new_text = text[:line_start] + extern_block + text[line_start:]
                  m2 = re.search(anchor_regex, new_text)
                  insert_at = m2.end()
                  new_text = new_text[:insert_at] + "\n" + call_block + new_text[insert_at:]
              elif insert_mode == "after_anchor_line":
                  # anchor_regex is expected to match the whole anchor line, including
                  # its trailing newline. Insert extern block before that line and the
                  # call block right after it.
                  line_start = text.rfind("\n", 0, m.start()) + 1
                  line_end = m.end()
                  new_text = text[:line_start] + extern_block + text[line_start:line_end] + call_block + text[line_end:]
              else:
                  REPORT.append(f"FAIL  {path}: unknown insert_mode")
                  return

              p.write_text(new_text)
              REPORT.append(f"OK    {path}: hook inserted")


          # These five hooks are the current official set required by
          # KernelSU-Next's non-GKI / manual-hook guide:
          # https://kernelsu-next.github.io/webpage/pages/how-to-integrate-for-non-gki.html
          # (drivers/kernelsu/Kbuild's "No hooks were defined" check is looking
          # for evidence of exactly these call sites.)

          # 1. fs/exec.c -- do_execve() hook (extern + call).
          #
          # Some kernel trees (this one included) already ship a partial or
          # full manual hook in fs/exec.c out of the box. Patching the extern
          # and the call as two independently-marked blocks is what bit us
          # last time: the extern's marker matched pre-existing text and was
          # correctly skipped, but the call's marker ("ksu_handle_execveat(
          # (int *)AT_FDCWD") did NOT match the tree's own differently
          # formatted call site, so we blindly inserted a second call --
          # anchored on a line that, in this tree, turned out to belong to a
          # different helper without a `filename` local in scope, causing:
          #   fs/exec.c:1921:40: error: use of undeclared identifier 'filename'
          #
          # Fix: detect ANY existing call site generically (not just our own
          # exact text) and skip the whole file if one is already there,
          # instead of risking a duplicate/misplaced insertion.
          _p = pathlib.Path("fs/exec.c")
          if not _p.exists():
              REPORT.append("SKIP  fs/exec.c: file not found")
          else:
              _text = _p.read_text()
              _has_extern = "extern int ksu_handle_execveat" in _text
              # A call looks like `ksu_handle_execveat(<arg>, ...)` where <arg>
              # is NOT "int *fd" (that prefix only ever appears in the extern
              # declaration's own parameter list).
              _has_call = re.search(r"ksu_handle_execveat\((?!int \*fd)", _text) is not None

              if _has_call:
                  REPORT.append(
                      "SKIP  fs/exec.c: an existing ksu_handle_execveat call site was "
                      "found in this tree already -- leaving it alone rather than risk "
                      "a duplicate/misplaced insertion. If execve hooking doesn't work "
                      "at runtime, check this call site by hand."
                  )
              else:
                  if not _has_extern:
                      m = re.search(r"(?s:int do_execve\(struct filename \*filename,.*?\)\s*\n\{)", _text)
                      if not m:
                          REPORT.append("FAIL  fs/exec.c: do_execve() signature not found, needs manual hook")
                          _text = None
                      else:
                          line_start = _text.rfind("\n", 0, m.start()) + 1
                          extern_block = (
                              "#ifdef CONFIG_KSU\n"
                              "__attribute__((hot))\n"
                              "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
                              "\t\t\t\tvoid *argv, void *envp, int *flags);\n"
                              "#endif\n\n"
                          )
                          _text = _text[:line_start] + extern_block + _text[line_start:]

                  if _text is not None:
                      m = re.search(r"[ \t]*struct user_arg_ptr envp = \{ \.ptr\.native = __envp \};\n", _text)
                      if not m:
                          REPORT.append("FAIL  fs/exec.c: do_execve() argv/envp locals not found, needs manual hook")
                      else:
                          call_block = (
                              "#ifdef CONFIG_KSU\n"
                              "\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n"
                              "#endif\n"
                          )
                          insert_at = m.end()
                          _text = _text[:insert_at] + call_block + _text[insert_at:]

                          # Optional: compat_do_execve() (32-bit ABI). Best-effort --
                          # many trees don't build this path with CONFIG_COMPAT off.
                          m2 = re.search(r"[ \t]*\.ptr\.compat = __envp,\n[ \t]*\};\n", _text)
                          if m2:
                              compat_call = (
                                  "#ifdef CONFIG_KSU // 32-bit ksud and 32-on-64 support\n"
                                  "\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n"
                                  "#endif\n"
                              )
                              _text = _text[:m2.end()] + compat_call + _text[m2.end():]

                          _p.write_text(_text)
                          REPORT.append("OK    fs/exec.c: hook inserted")


          # 2. fs/open.c -- faccessat hook
          patch_file(
              "fs/open.c",
              marker="ksu_handle_faccessat",
              anchor_regex=r"SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\)\s*\n\{",
              extern_block=(
                  "#ifdef CONFIG_KSU\n"
                  "__attribute__((hot))\n"
                  "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
                  "\t\t\t\tint *mode, int *flags);\n"
                  "#endif\n\n"
              ),
              call_block=(
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
                  "#endif\n\n"
              ),
              insert_mode="before_line",
          )

          # 3. fs/read_write.c -- su compat for `read` syscall, anchored on
          #    SYSCALL_DEFINE3(read...) itself (not vfs_read -- older/wrong
          #    anchor is what caused the "No hooks were defined" failure).
          patch_file(
              "fs/read_write.c",
              marker="ksu_handle_sys_read",
              anchor_regex=r"SYSCALL_DEFINE3\(read, unsigned int, fd, char __user \*, buf, size_t, count\)\s*\n\{",
              extern_block=(
                  "#ifdef CONFIG_KSU\n"
                  "extern bool ksu_vfs_read_hook __read_mostly;\n"
                  "extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd,\n"
                  "\t\t\t\tchar __user **buf_ptr, size_t *count_ptr);\n"
                  "#endif\n\n"
              ),
              call_block=(
                  "#ifdef CONFIG_KSU\n"
                  "\tif (unlikely(ksu_vfs_read_hook))\n"
                  "\t\tksu_handle_sys_read(fd, &buf, &count);\n"
                  "#endif\n"
              ),
              insert_mode="before_line",
          )

          # 4. fs/stat.c -- newfstatat hook (su path spoofing under sucompat)
          patch_file(
              "fs/stat.c",
              marker="ksu_handle_stat",
              anchor_regex=r"(?s:SYSCALL_DEFINE4\(newfstatat, int, dfd, const char __user \*, filename,.*?struct stat __user \*, statbuf, int, flag\)\s*\n\{)",
              extern_block=(
                  "#ifdef CONFIG_KSU\n"
                  "__attribute__((hot))\n"
                  "extern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n"
                  "\t\t\t\tint *flags);\n"
                  "#endif\n\n"
              ),
              call_block=(
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_stat(&dfd, &filename, &flag);\n"
                  "#endif\n"
              ),
              insert_mode="before_line",
          )

          # 5. kernel/reboot.c -- reboot hook (module umount / safe teardown)
          patch_file(
              "kernel/reboot.c",
              marker="ksu_handle_sys_reboot",
              anchor_regex=r"(?s:SYSCALL_DEFINE4\(reboot, int, magic1, int, magic2, unsigned int, cmd,.*?void __user \*, arg\)\s*\n\{)",
              extern_block=(
                  "#ifdef CONFIG_KSU\n"
                  "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
                  "#endif\n\n"
              ),
              call_block=(
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
                  "#endif\n"
              ),
              insert_mode="before_line",
          )

          report_path = "/tmp/patch-report.txt"
          pathlib.Path(report_path).write_text("\n".join(REPORT) + "\n")
          print("\n".join(REPORT))

          failures = [r for r in REPORT if r.startswith("FAIL")]
          if failures:
              print("\n::warning::Some hooks could not be auto-patched -- apply them manually, see patch-report.txt")

          PYEOF
          python3 /tmp/apply_ksu_hooks.py
          cp /tmp/patch-report.txt patch-report.txt

      - name: Backport path_umount to fs/namespace.c (pre-5.9 kernels)
        # Fixes: "ld.lld: error: undefined symbol: path_umount" during the
        # final link.
        #
        # KernelSU-Next's own Kbuild logic (see the "-- KSU_NEXT: adding
        # function ... to ../fs/namespace.c" lines in the build log) only
        # ever inserts a forward *declaration* of path_umount()/can_umount()
        # when it can't find them already defined -- it never adds the
        # actual function bodies. On any kernel older than 5.9 (path_umount
        # was only introduced upstream in 5.9), that leaves drivers/kernelsu
        # calling a symbol that is declared but never implemented, which
        # compiles fine and then fails at the vmlinux link step.
        #
        # This step applies the official backport from the KernelSU non-GKI
        # guide (https://kernelsu.org/guide/how-to-integrate-for-non-gki.html
        # -> "How to backport path_umount") *before* the build runs, so that
        # by the time KernelSU-Next's Kbuild scans fs/namespace.c it finds a
        # real implementation already there and skips its own declaration-only
        # patch instead of leaving a dangling symbol.
        run: |
          set -e
          cat > /tmp/backport_path_umount.py <<'PYEOF'
          import re, pathlib, sys

          REPORT = []
          p = pathlib.Path("fs/namespace.c")

          if not p.exists():
              REPORT.append("SKIP  fs/namespace.c: file not found")
          else:
              text = p.read_text()

              if re.search(r"\bint\s+path_umount\s*\(\s*struct path\s*\*\s*path\s*,\s*int\s+flags\s*\)\s*\n?\s*\{", text):
                  REPORT.append("SKIP  fs/namespace.c: path_umount already implemented")
              else:
                  # Anchor on the umount(2) syscall definition, which is present
                  # (in some form) in every namespace.c that implements umount.
                  # The backport is inserted immediately before it, matching the
                  # placement used by the upstream 5.9 patch this is lifted from.
                  anchor_re = re.compile(
                      r"[ \t]*SYSCALL_DEFINE2\(umount,\s*char __user \*,\s*name,\s*int,\s*flags\)\s*\n\{"
                  )
                  m = anchor_re.search(text)
                  if not m:
                      REPORT.append(
                          "FAIL  fs/namespace.c: SYSCALL_DEFINE2(umount...) anchor not found -- "
                          "backport path_umount by hand, see "
                          "https://kernelsu.org/guide/how-to-integrate-for-non-gki.html#how-to-backport-path-umount"
                      )
                  else:
                      line_start = text.rfind("\n", 0, m.start()) + 1
                      backport = (
                          "static int can_umount(const struct path *path, int flags)\n"
                          "{\n"
                          "\tstruct mount *mnt = real_mount(path->mnt);\n"
                          "\n"
                          "\tif (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))\n"
                          "\t\treturn -EINVAL;\n"
                          "\tif (!may_mount())\n"
                          "\t\treturn -EPERM;\n"
                          "\tif (path->dentry != path->mnt->mnt_root)\n"
                          "\t\treturn -EINVAL;\n"
                          "\tif (!check_mnt(mnt))\n"
                          "\t\treturn -EINVAL;\n"
                          "\tif (mnt->mnt.mnt_flags & MNT_LOCKED) /* Check optimistically */\n"
                          "\t\treturn -EINVAL;\n"
                          "\tif (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))\n"
                          "\t\treturn -EPERM;\n"
                          "\treturn 0;\n"
                          "}\n"
                          "\n"
                          "int path_umount(struct path *path, int flags)\n"
                          "{\n"
                          "\tstruct mount *mnt = real_mount(path->mnt);\n"
                          "\tint ret;\n"
                          "\n"
                          "\tret = can_umount(path, flags);\n"
                          "\tif (!ret)\n"
                          "\t\tret = do_umount(mnt, flags);\n"
                          "\n"
                          "\t/* we mustn't call path_put() as that would clear mnt_expiry_mark */\n"
                          "\tdput(path->dentry);\n"
                          "\tmntput_no_expire(mnt);\n"
                          "\treturn ret;\n"
                          "}\n"
                          "\n"
                      )
                      new_text = text[:line_start] + backport + text[line_start:]
                      p.write_text(new_text)
                      REPORT.append("OK    fs/namespace.c: path_umount/can_umount backport inserted")

          print("\n".join(REPORT))
          with open("patch-report.txt", "a") as f:
              f.write("\n".join(REPORT) + "\n")

          if any(r.startswith("FAIL") for r in REPORT):
              print("::warning::path_umount backport could not be auto-applied -- apply it manually, see patch-report.txt")
          PYEOF
          python3 /tmp/backport_path_umount.py

      - name: Remaining manual hooks (informational)
        run: |
          cat <<'EOF'
          This workflow now auto-patches all five hooks required by the
          current official KernelSU-Next non-GKI guide, plus the
          path_umount backport:
            1. fs/exec.c        -> do_execve / ksu_handle_execveat
            2. fs/open.c        -> faccessat  / ksu_handle_faccessat
            3. fs/read_write.c  -> read       / ksu_handle_sys_read
            4. fs/stat.c        -> newfstatat / ksu_handle_stat
            5. kernel/reboot.c  -> reboot     / ksu_handle_sys_reboot
            6. fs/namespace.c   -> can_umount/path_umount backport, needed
               on any tree older than 5.9 for the KernelSU "module umount"
               feature (this is also what fixes the
               "ld.lld: error: undefined symbol: path_umount" link failure).

          These are anchor/regex based, so they are only as good as the match
          against YOUR tree's exact function signatures -- always check
          patch-report.txt (uploaded as an artifact even on build failure)
          for FAIL lines before assuming a hook actually landed.

          Additionally, patches/susfs_patch_to_5_4.patch (SUSFS) is applied
          right before the build step, via git apply / patch -p1. Same rule
          applies: check patch-report.txt for a FAIL line if you don't see
          CONFIG_KSU_SUSFS behaving as expected.

          See: https://kernelsu-next.github.io/webpage/pages/how-to-integrate-for-non-gki.html
          EOF

      - name: Apply SUSFS patch (patches/susfs_patch_to_5_4.patch)
        # Applies the SUSFS (Simple Universal Sus-Free System) patch that must
        # ship inside the repo at patches/susfs_patch_to_5_4.patch. This adds
        # fs/susfs.c plus the CONFIG_KSU_SUSFS* hooks into fs/namei.c,
        # fs/Makefile, etc. It has to run before "Build kernel" so the new
        # files/hooks are present when Kconfig/Makefile are evaluated.
        #
        # Tries `git apply` first (tolerates whitespace drift better and
        # gives a clean dry-run check via --check), then falls back to
        # classic `patch -p1` for repos where the tree isn't a plain git
        # checkout state the patch expects. Non-fatal on failure -- like the
        # other auto-patch steps in this workflow, it logs to
        # patch-report.txt and emits a ::warning:: instead of killing the
        # whole job, since a bad match here doesn't necessarily mean the
        # kernel itself won't compile (only that SUSFS won't be present).
        run: |
          set -e
          PATCH_FILE="patches/susfs_patch_to_5_4.patch"

          # ---- Diagnostics: printed on every run, not just on failure, so ----
          # ---- the next run's log tells us exactly *why* the file is/isn't ----
          # ---- where we expect it, instead of just "not found".           ----
          echo "== SUSFS patch diagnostics =="
          echo "-- patches/ directory as checked out --"
          ls -la patches 2>/dev/null || echo "(no patches/ directory at all in this checkout)"
          echo "-- files git actually tracks with 'susfs' in the name, on this ref --"
          git ls-files | grep -i susfs || echo "(git tracks no file with 'susfs' in its name on $(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo this ref))"
          echo "-- any *.patch file anywhere in the tree (tracked or not) --"
          find . -maxdepth 4 -iname '*.patch' -not -path './proton-clang/*' -not -path './.git/*' 2>/dev/null || true
          echo "-- .gitignore rules that could be hiding a patches/ file --"
          { [ -f .gitignore ] && grep -nE 'patch' .gitignore; } || echo "(no matching .gitignore rule)"

          if [ ! -f "$PATCH_FILE" ]; then
            # Fall back to searching the whole tree for a plausibly-named
            # susfs patch before giving up -- handles it being committed
            # under different case, extension, or a different subfolder than
            # exactly "patches/susfs_patch_to_5_4.patch".
            FOUND=$(find . -maxdepth 4 \( -iname 'susfs*patch*' -o -iname '*susfs*.patch' -o -iname '*susfs*.diff' \) -not -path './proton-clang/*' -not -path './.git/*' 2>/dev/null | head -n1 || true)
            if [ -n "$FOUND" ]; then
              echo "\"$PATCH_FILE\" not found, but a likely match was found elsewhere in the tree: $FOUND -- using that instead."
              PATCH_FILE="$FOUND"
            fi
          fi

          if [ ! -f "$PATCH_FILE" ]; then
            echo "::warning::SUSFS patch not applied -- no susfs patch file was found anywhere in the checked-out tree (see the diagnostics printed earlier in this step's log). The three most likely causes: (1) the file exists on your machine but was never actually 'git add'ed/committed/pushed to the topaz-rebase branch -- run 'git status' and 'git log --oneline -- patches/' locally to confirm; (2) it's excluded by a .gitignore rule matching *.patch or patches/ -- if so, force-add it with 'git add -f patches/susfs_patch_to_5_4.patch'; (3) it was committed to a different branch than the one this workflow builds (topaz-rebase). Once you confirm which it is, re-run -- no code change to this workflow is needed if the fix is on the repo side."
            echo "SKIP  $PATCH_FILE: file not found in repo" >> patch-report.txt
            exit 0
          fi

          if git apply --check "$PATCH_FILE" 2>/tmp/susfs_git_apply_check.log; then
            git apply "$PATCH_FILE"
            echo "OK    $PATCH_FILE: applied cleanly via git apply" | tee -a patch-report.txt
          elif patch -p1 --dry-run -f < "$PATCH_FILE" >/tmp/susfs_patch_dryrun.log 2>&1; then
            patch -p1 -f < "$PATCH_FILE"
            echo "OK    $PATCH_FILE: applied cleanly via patch -p1 (git apply --check failed, see log below)" | tee -a patch-report.txt
            cat /tmp/susfs_git_apply_check.log
          else
            echo "::warning::SUSFS patch did not apply cleanly -- the tree's fs/namei.c, fs/Makefile, etc. may already differ from what patches/susfs_patch_to_5_4.patch expects (already-patched tree, wrong kernel version/branch, or upstream drift). Build will continue without SUSFS. See patch-report.txt and the step log for the git apply / patch rejection details."
            {
              echo "FAIL  $PATCH_FILE: did not apply via git apply or patch -p1"
              echo "--- git apply --check output ---"
              cat /tmp/susfs_git_apply_check.log
              echo "--- patch -p1 --dry-run output ---"
              cat /tmp/susfs_patch_dryrun.log
            } >> patch-report.txt
          fi

      - name: Build kernel
        timeout-minutes: 120
        run: |
          set -e
          ARCH="${{ github.event.inputs.arch || 'arm64' }}"
          DEFCONFIG_PATH="${{ steps.discover.outputs.defconfig_path }}"
          DEFCONFIG_NAME="$(basename "$DEFCONFIG_PATH" _defconfig)"
          HAS_GENERATE_DEFCONFIG="${{ steps.discover.outputs.has_generate_defconfig }}"
          BUILD_CONFIG="${{ github.event.inputs.build_config }}"
          if [ -z "$BUILD_CONFIG" ]; then
            BUILD_CONFIG="${{ steps.discover.outputs.build_config }}"
          fi

          # Figure out the defconfig argument the way `make` expects it,
          # i.e. relative to arch/$ARCH/configs, e.g. "vendor/lineage_dubai.config".
          DEFCONFIG_ARG="${DEFCONFIG_PATH#arch/$ARCH/configs/}"

          # CC/CROSS_COMPILE/etc. are already exported globally via $GITHUB_ENV
          # from the "Fetch Proton Clang toolchain" step, so build.sh inherits
          # them too. We still pass them explicitly to `make` as a safety net,
          # since some old CAF Makefiles only honor command-line overrides.
          MAKE_TOOLCHAIN_ARGS=(
            "CC=$CC"
            "CROSS_COMPILE=$CROSS_COMPILE"
            "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
            "CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT"
            "AR=$AR" "NM=$NM" "OBJCOPY=$OBJCOPY" "OBJDUMP=$OBJDUMP" "STRIP=$STRIP"
          )

          if [ -f build.sh ]; then
            chmod +x build.sh
          fi

          if [ -n "$BUILD_CONFIG" ] && [ -x build.sh ]; then
            echo "==> Building via build.sh with BUILD_CONFIG=$BUILD_CONFIG (this script also packages the AnyKernel3 zip)"
            BUILD_CONFIG="$BUILD_CONFIG" ./build.sh
          else
            echo "==> No usable build.sh/build.config pair — using plain make with $DEFCONFIG_ARG"
            echo "::warning::Falling back to plain make. This will only produce a raw Image, not a flashable AnyKernel3 zip — the dedicated 'Package AnyKernel3 zip' step later in this job will handle that instead."
            if [ "$HAS_GENERATE_DEFCONFIG" = "true" ]; then
              echo "Running scripts/gki/generate_defconfig.sh to merge QGKI fragments first"
              ARCH="$ARCH" scripts/gki/generate_defconfig.sh "$DEFCONFIG_ARG" || \
                echo "::warning::generate_defconfig.sh failed or isn't needed for this tree — continuing with make directly"
            fi
            make ARCH="$ARCH" O=out "${MAKE_TOOLCHAIN_ARGS[@]}" "$DEFCONFIG_ARG"
            make ARCH="$ARCH" O=out "${MAKE_TOOLCHAIN_ARGS[@]}" -j"$(nproc)"
          fi

          echo "==> Build step finished. Checking for a kernel Image..."
          IMAGE_PATH=$(find out/arch/"$ARCH"/boot -maxdepth 1 -iname "Image*" 2>/dev/null | head -n1 || true)
          if [ -z "$IMAGE_PATH" ]; then
            # build.sh (when used) may keep the Image somewhere other than
            # out/arch/$ARCH/boot and package its own flashable zip straight
            # into $GITHUB_WORKSPACE instead. That's still a successful
            # build — only treat this as a real failure if build.sh (or
            # plain make) *also* failed to leave a zip we can pick up later.
            EXISTING_ZIP=$(find . -maxdepth 2 -iname "*.zip" -not -path "./proton-clang/*" -not -path "./out/*" 2>/dev/null | head -n1 || true)
            if [ -n "$EXISTING_ZIP" ]; then
              echo "::warning::No Image under out/arch/$ARCH/boot, but build.sh already packaged a flashable zip at $EXISTING_ZIP — treating the build as successful. (If your build.sh uses a custom OUT_DIR, consider exporting OUT_DIR=out so future steps can also see the raw Image/dtb/dtbo.)"
            else
              echo "::error::No Image was produced under out/arch/$ARCH/boot after the build step, and no flashable zip was found anywhere else in the workspace either. The compile did not actually finish successfully — scroll up in this same step's log for the first real compiler/linker error (search for 'error:' or 'Error 2'), fix it, and re-run. Packaging steps further down cannot do anything without an Image."
              exit 1
            fi
          else
            echo "Found kernel Image at: $IMAGE_PATH"
          fi

      - name: Package AnyKernel3 zip
        id: anykernel
        if: always()
        run: |
          set -e
          ARCH="${{ github.event.inputs.arch || 'arm64' }}"
          mkdir -p /tmp/anykernel-out

          # If build.sh already produced a flashable zip itself (it does its
          # own AnyKernel3 packaging when it runs), just pick that up instead
          # of packaging a second, possibly-conflicting zip. Do this check
          # FIRST, before looking for a raw Image under out/arch/$ARCH/boot —
          # some build.sh variants use a different OUT_DIR internally and
          # never leave the Image there at all, even on a fully successful
          # build, so requiring it here would wrongly skip packaging.
          EXISTING_ZIP=$(find . -maxdepth 2 -iname "*.zip" -not -path "./proton-clang/*" -not -path "./out/*" 2>/dev/null | head -n1 || true)
          if [ -n "$EXISTING_ZIP" ]; then
            echo "build.sh already packaged a flashable zip at: $EXISTING_ZIP"
            cp "$EXISTING_ZIP" /tmp/anykernel-out/
            exit 0
          fi

          if [ ! -f "out/arch/$ARCH/boot/Image" ] && [ ! -f "out/arch/$ARCH/boot/Image.gz" ]; then
            echo "::warning::No Image under out/arch/$ARCH/boot and no zip produced by build.sh either — the build step above must have failed or exited early. Nothing to package."
            exit 0
          fi

          # Otherwise (plain-`make` path), package it ourselves using an
          # AnyKernel3 template already committed in the repo, if there is one.
          AK_DIR=""
          for d in anykernel AnyKernel3 anykernel3 AnyKernel; do
            if [ -f "$d/anykernel.sh" ]; then
              AK_DIR="$d"
              break
            fi
          done

          if [ -z "$AK_DIR" ]; then
            echo "::warning::No AnyKernel3 template (an anykernel.sh) found in this repo, and build.sh didn't package a zip either. Add an AnyKernel3 folder configured for this device (or fix build.sh so its own packaging runs) — uploading the raw Image/dtb/dtbo only for now."
            exit 0
          fi

          echo "Packaging with AnyKernel3 template at: $AK_DIR"
          WORKDIR=$(mktemp -d)
          cp -r "$AK_DIR"/. "$WORKDIR"/
          cp "out/arch/$ARCH/boot/Image" "$WORKDIR"/ 2>/dev/null || cp "out/arch/$ARCH/boot/Image.gz" "$WORKDIR"/ 2>/dev/null || true
          DTB=$(find "out/arch/$ARCH/boot" -maxdepth 1 -iname "*.dtb" 2>/dev/null | head -n1 || true)
          [ -n "$DTB" ] && cp "$DTB" "$WORKDIR/dtb"
          DTBO=$(find "out/arch/$ARCH/boot" -maxdepth 1 -iname "dtbo.img" 2>/dev/null | head -n1 || true)
          [ -n "$DTBO" ] && cp "$DTBO" "$WORKDIR/dtbo.img"

          ZIP_NAME="AtomX-${{ github.event.inputs.defconfig || 'kernel' }}-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::8}.zip"
          ZIP_NAME="${ZIP_NAME//\//-}"
          (cd "$WORKDIR" && zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x ".git*")
          echo "Created $ZIP_NAME"
          cp "$ZIP_NAME" /tmp/anykernel-out/

      - name: Locate build outputs
        id: outputs
        if: always()
        run: |
          {
            echo "found<<EOF"
            ARCH="${{ github.event.inputs.arch || 'arm64' }}"
            find out/arch/"$ARCH"/boot -maxdepth 1 \( -iname "Image*" -o -iname "*.dtb" -o -iname "dtbo.img" \) 2>/dev/null || true
            find /tmp/anykernel-out -maxdepth 1 -iname "*.zip" 2>/dev/null || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomx-kernel-kernelsu-next-legacy
          path: |
            out/arch/*/boot/Image*
            out/arch/*/boot/*.dtb
            out/arch/*/boot/dtbo.img
            /tmp/anykernel-out/*.zip
            patch-report.txt
          if-no-files-found: error
